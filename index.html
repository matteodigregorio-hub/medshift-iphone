<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#163454">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MedShift">
  <meta name="description" content="La tua agenda personale per turni, calendario e statistiche.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="stylesheet" href="./app.css">
  <title>MedShift · La tua agenda</title>
  <script src="./app.js" defer></script>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div><div class="brand">Med<span>Shift</span></div><div class="tagline">Il tuo lavoro, più semplice.</div></div>
    <div class="header-badge" aria-label="Applicazione offline">✚</div>
  </header>
  <main id="main" aria-live="polite"></main>
  <nav class="bottom-nav" aria-label="Sezioni MedShift">
    <button data-tab="home" class="active"><span class="nav-icon">⌂</span><span>Home</span></button>
    <button data-tab="shifts"><span class="nav-icon">▤</span><span>Turni</span></button>
    <button data-tab="calendar"><span class="nav-icon">▦</span><span>Calendario</span></button>
    <button data-tab="stats"><span class="nav-icon">▥</span><span>Statistiche</span></button>
    <button data-tab="profile"><span class="nav-icon">♙</span><span>Profilo</span></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
</body>
</html>
